<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слайдшоу</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: #ffffff;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }
  .slide img,
  .slide video {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .slide.photo.active img {
    animation: kenburns var(--ken, 10s) ease-out forwards;
  }
  @keyframes kenburns {
    from { transform: scale(1); }
    to   { transform: scale(1.15); }
  }

  #settings {
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 10;
    width: 68px;
    height: 68px;
    pointer-events: auto;
  }
  #settings .gear {
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #settings:hover .gear,
  #settings:focus-within .gear { opacity: .85; }
  #settings .panel {
    position: absolute;
    right: 14px;
    bottom: 64px;
    background: rgba(255,255,255,.96);
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    width: 260px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #222;
    font-size: 14px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
  }
  #settings:hover .panel,
  #settings:focus-within .panel {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #settings .panel label { display: flex; flex-direction: column; gap: 6px; }
  #settings .panel label.row { flex-direction: row; align-items: center; gap: 8px; }
  #settings .panel input[type="range"] { width: 100%; }
  #settings .panel select,
  #settings .panel input[type="number"] { padding: 5px; border: 1px solid #ccc; border-radius: 6px; }
  #settings .panel .val { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="settings">
    <div class="gear">&#9881;</div>
    <div class="panel">
      <label>
        Продолжительность фото: <span class="val" id="durVal">10</span> с
        <input type="range" id="duration" min="1" max="30" step="1" value="10">
      </label>
      <label class="row">
        <input type="checkbox" id="random"> Случайный порядок
      </label>
      <label>
        Перейти к слайду:
        <select id="jump"></select>
      </label>
    </div>
  </div>

  <script>
  let PHOTO_DURATION = 10000;
  const stage = document.getElementById('stage');
  let index = 0;
  let slides = [];
  let list = [];
  let currentTimer = null;
  let randomMode = false;

  function isVideo(src) {
    return /\.(mp4|webm|ogg|mov|m4v)$/i.test(src);
  }

  function baseName(src) {
    return src.split('/').pop();
  }

  function buildSlides(srcList) {
    srcList.forEach((src) => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      if (isVideo(src)) {
        const video = document.createElement('video');
        video.src = src;
        video.muted = false;
        video.playsInline = true;
        video.preload = 'auto';
        video.onerror = () => {
          slide.dataset.failed = '1';
          if (slide.classList.contains('active')) next();
        };
        slide.appendChild(video);
      } else {
        slide.className += ' photo';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.onerror = () => {
          slide.dataset.failed = '1';
          if (slide.classList.contains('active')) next();
        };
        slide.appendChild(img);
      }
      stage.appendChild(slide);
      slides.push(slide);
    });
    populateJump();
  }

  function populateJump() {
    const sel = document.getElementById('jump');
    sel.innerHTML = '';
    list.forEach((src, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i + 1) + '. ' + baseName(src);
      sel.appendChild(opt);
    });
  }

  function showSlide(i) {
    if (currentTimer) { clearTimeout(currentTimer); currentTimer = null; }

    if (slides[i].dataset.failed) {
      next();
      return;
    }

    slides.forEach((s, idx) => {
      const media = s.querySelector('img, video');
      s.classList.toggle('active', idx === i);
      if (media && media.tagName === 'VIDEO') {
        media.pause();
        media.currentTime = 0;
        if (idx !== i) { media.removeAttribute('src'); media.load(); }
      }
    });

    const current = slides[i];
    const media = current.querySelector('img, video');

    if (media && media.tagName === 'VIDEO') {
      media.src = list[i];
      media.load();
      const playPromise = media.play();
      if (playPromise) playPromise.catch(() => {});
      media.onended = next;
    } else {
      current.style.setProperty('--ken', (PHOTO_DURATION / 1000) + 's');
      currentTimer = setTimeout(next, PHOTO_DURATION);
    }
  }

  function next() {
    if (randomMode && slides.length > 1) {
      let n;
      do { n = Math.floor(Math.random() * slides.length); } while (n === index);
      index = n;
    } else {
      index = (index + 1) % slides.length;
    }
    showSlide(index);
  }

  function jumpTo(i) {
    index = i;
    showSlide(i);
  }

  document.getElementById('duration').addEventListener('input', (e) => {
    const sec = parseInt(e.target.value, 10);
    PHOTO_DURATION = sec * 1000;
    document.getElementById('durVal').textContent = sec;
    const current = slides[index];
    if (current && current.classList.contains('photo') && current.classList.contains('active')) {
      if (currentTimer) clearTimeout(currentTimer);
      current.style.setProperty('--ken', sec + 's');
      currentTimer = setTimeout(next, PHOTO_DURATION);
    }
  });

  document.getElementById('random').addEventListener('change', (e) => {
    randomMode = e.target.checked;
  });

  document.getElementById('jump').addEventListener('change', (e) => {
    jumpTo(parseInt(e.target.value, 10));
  });

  fetch('assets.json')
    .then(r => r.json())
    .then(data => {
      list = data;
      buildSlides(list);
      if (slides.length) showSlide(0);
    })
    .catch(err => {
      console.error('Не удалось загрузить assets.json', err);
    });
  </script>
</body>
</html>
